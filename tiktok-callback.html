<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna Forge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500&display=swap');

  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #1c1f2b; --text-dim: #5b6072;
    --accent: #b5502a; --border: #dde0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14151f; --surface: #1b1d2a; --text: #e7e6ea; --text-dim: #9b9fb2; --accent: #e3936b; --border: #2c2f42; }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: var(--text);
  }
  .card { text-align: center; max-width: 360px; padding: 32px; }
  .mark { color: var(--accent); margin-bottom: 18px; }
  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 8px;
  }
  p { color: var(--text-dim); font-size: 15px; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="margin:0 auto 18px;display:block;">
      <mask id="crescent"><rect width="32" height="32" fill="#fff"/><circle cx="21" cy="12" r="10" fill="#000"/></mask>
      <circle cx="16" cy="16" r="12" fill="currentColor" mask="url(#crescent)"/>
      <rect x="11" y="27" width="10" height="2.5" rx="1.25" fill="currentColor"/>
    </svg>
    <h1>You're all set</h1>
    <p>Luna Forge's TikTok connection runs locally on the owner's own device. You can close this window.</p>
  </div>
</body>
</html>
