<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna Forge</title>
<link rel="icon" type="image/png" href="/icon-32.png">
<style>
  :root{ --bg:#0a0818; --ink:#f4f0e6; --muted:#b9b3d9; --ember:#e87a39; }
  *{box-sizing:border-box}
  html,body{ height:100%; margin:0; }
  body{
    background:radial-gradient(ellipse at 30% 0%, #1c1746 0%, var(--bg) 55%);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  .card{ text-align:center; max-width:360px; padding:32px; }
  .card img{ width:56px; height:56px; border-radius:14px; margin-bottom:18px; }
  h1{ font-size:1.3rem; margin:0 0 8px; }
  p{ color:var(--muted); font-size:0.95rem; margin:0; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-64.png" alt="Luna Forge">
    <h1>You're all set</h1>
    <p>Luna Forge's TikTok connection runs locally on the owner's own device. You can close this window.</p>
  </div>
</body>
</html>
